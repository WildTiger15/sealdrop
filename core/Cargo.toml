[package]
name = "sealdrop-core"
version = "0.1.0"
edition = "2024"
description = "Post quantum hybrid file encryption core for SealDrop (not audited)"
license = "MIT"
publish = false

[features]
# Exposes derandomized functions for known answer tests only. Never enable in apps.
hazmat = []

[dependencies]
ml-kem = { version = "0.3.3", features = ["zeroize"] }
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "rand_core", "zeroize"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
hkdf = "0.13.0"
sha2 = "0.11.1"
sha3 = "0.12.0"
shake = "0.1.0"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
zeroize = { version = "1.9.1", features = ["derive"] }
subtle = "2.6.1"
getrandom = { version = "0.4.3", features = ["sys_rng"] }

[dev-dependencies]
sealdrop-core = { path = ".", features = ["hazmat"] }
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc"] }
subtle = "2.6.1"
hex = "0.4.3"
serde_json = "1.0.154"
# Benchmarks only: classic baselines
criterion = "0.8.2"
ed25519-dalek = "3.0.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }

[[bench]]
name = "crypto"
harness = false
