[package]
name = "sealdrop-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sealdrop-core = { path = "../core" }
wasm-bindgen = "0.2.129"

# Browser randomness: getrandom uses crypto.getRandomValues on the web.
# Enabled only here (the app), not in the core library, as getrandom recommends.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
